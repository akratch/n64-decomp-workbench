<svg xmlns="http://www.w3.org/2000/svg" width="1472" height="1043" viewBox="0 0 1472 1043" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13"><rect width="100%" height="100%" rx="8" fill="#0d1117"/><text y="31" xml:space="preserve"><tspan x="18.0" fill="#e6edf3" font-weight="bold">COMPARISON</tspan></text><text y="50" xml:space="preserve"><tspan x="18.0" fill="#e6edf3" font-weight="bold">verdict=</tspan><tspan x="80.8" fill="#ff7b72" font-weight="bold">allocation-mismatch</tspan><tspan x="229.9" fill="#e6edf3"> aligned_total=   6 words=   6 raw=   6 norm=   6 regs=   6 fp=   0 insns=  24 frame=  -32 sha1=3695ba89a1ea examples/fixtures/phase-shift-candidate.objdump</tspan></text><text y="69" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">aligned residual classes: aligned_register=6</tspan></text><text y="88" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">raw difference classes: instruction_bits=6</tspan></text><text y="107" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">diff_sites=6 (register=6)</tspan></text><text y="126" xml:space="preserve"></text><text y="145" xml:space="preserve"><tspan x="18.0" fill="#e6edf3" font-weight="bold">MECHANISM</tspan></text><text y="164" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">view animStep  target_instructions=24 candidate_instructions=24 aligned_rows=24 match=18 target_frame_size=-32 candidate_frame_size=-32 register_profile=ido53</tspan></text><text y="183" xml:space="preserve"><tspan x="18.0" fill="#e6edf3" font-weight="bold">verdict:</tspan><tspan x="80.8" fill="#e6edf3"> </tspan><tspan x="88.6" fill="#d2a8ff" font-weight="bold">phase-shift</tspan><tspan x="175.0" fill="#e6edf3">  structural=0 schedule=0 register=6 constant=0 hunks=1 playbook=temp-fifo-phase</tspan></text><text y="202" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">signature: prefix-exact@12 state-divergence@temp:5 register-first-divergence</tspan></text><text y="221" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  signature reads left to right: how much is untouched, where state first drifts, then which axis it drifted on - in that causal order.</tspan></text><text y="240" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">webs: </tspan><tspan x="65.1" fill="#39c5cf">w1 t7-&gt;t8 x2</tspan><tspan x="159.3" fill="#e6edf3">, </tspan><tspan x="175.0" fill="#d29922">w2 t8-&gt;t9 x2</tspan><tspan x="269.2" fill="#e6edf3">, </tspan><tspan x="284.9" fill="#bc8cff">w3 t9-&gt;t6 x2</tspan><tspan x="379.1" fill="#e6edf3">, </tspan><tspan x="394.8" fill="#3fb950">w4 t6-&gt;t7 x2</tspan></text><text y="259" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">labels defined: decomp-workbench --explain-keys</tspan></text><text y="278" xml:space="preserve"><tspan x="18.0" fill="#ff7b72" font-weight="bold">the FIRST divergence is a register-class divergence, not a structural one: the decision was made upstream of hunk 1 even though it surfaces there.</tspan></text><text y="297" xml:space="preserve"></text><text y="316" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">REGISTER LANES (per-class assignment sequences, matching instructions included)</tspan></text><text y="335" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  pool = uopt&#x27;s colored variable webs (lowest free index wins); temp = ugen&#x27;s block-local least-recently-freed ring - two independent register populations that diverge independently. Which registers are in which population is per-compiler-era data: see --register-profile.</tspan></text><text y="354" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  pool  target     s0 s1 s2 a0 s0   slots=0..4/5</tspan></text><text y="373" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">        candidate  s0 s1 s2 a0 s0</tspan></text><text y="392" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">                   identical 5/5</tspan></text><text y="411" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  temp  target     t6 t7 t8 t9 t6 t7 t8 t9 t6   slots=0..8/9</tspan></text><text y="430" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">        candidate  t6 t7 t8 t9 t6 t8 t9 t6 t7</tspan></text><text y="449" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">                   ---------------^ slot=5 aligned_row=12 rotation=+1</tspan></text><text y="468" xml:space="preserve"></text><text y="487" xml:space="preserve"><tspan x="18.0" fill="#e6edf3" font-weight="bold">HUNK 1</tspan><tspan x="65.1" fill="#e6edf3">  class=register rows=12..17 target=12..17 candidate=12..17 target_bytes=0x30..0x44 candidate_bytes=0x30..0x44</tspan></text><text y="506" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">     10   sll $t6,$t9,2     | sll $t6,$t9,2</tspan></text><text y="525" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">     11   addu $s2,$s1,$t6  | addu $s2,$s1,$t6</tspan></text><text y="544" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">     12 &gt; addu </tspan><tspan x="135.8" fill="#39c5cf">$t7</tspan><tspan x="159.3" fill="#e6edf3">,$s2,$s0  | addu </tspan><tspan x="292.8" fill="#39c5cf">$t8</tspan><tspan x="316.3" fill="#e6edf3">,$s2,$s0   </tspan><tspan x="402.6" fill="#39c5cf">t7-&gt;t8 [w1]</tspan></text><text y="563" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">     13 &gt; lw </tspan><tspan x="120.0" fill="#d29922">$t8</tspan><tspan x="143.6" fill="#e6edf3">,20(</tspan><tspan x="175.0" fill="#39c5cf">$t7</tspan><tspan x="198.6" fill="#e6edf3">)    | lw </tspan><tspan x="277.1" fill="#d29922">$t9</tspan><tspan x="300.6" fill="#e6edf3">,20(</tspan><tspan x="332.0" fill="#39c5cf">$t8</tspan><tspan x="355.6" fill="#e6edf3">)     </tspan><tspan x="402.6" fill="#d29922">t8-&gt;t9 [w2]</tspan><tspan x="489.0" fill="#e6edf3"> </tspan><tspan x="496.9" fill="#39c5cf">t7-&gt;t8 [w1]</tspan></text><text y="582" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">     14 &gt; andi </tspan><tspan x="135.8" fill="#bc8cff">$t9</tspan><tspan x="159.3" fill="#e6edf3">,</tspan><tspan x="167.2" fill="#d29922">$t8</tspan><tspan x="190.7" fill="#e6edf3">,0xff | andi </tspan><tspan x="292.8" fill="#bc8cff">$t6</tspan><tspan x="316.3" fill="#e6edf3">,</tspan><tspan x="324.2" fill="#d29922">$t9</tspan><tspan x="347.7" fill="#e6edf3">,0xff  </tspan><tspan x="402.7" fill="#bc8cff">t9-&gt;t6 [w3]</tspan><tspan x="489.0" fill="#e6edf3"> </tspan><tspan x="496.9" fill="#d29922">t8-&gt;t9 [w2]</tspan></text><text y="601" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">     15 &gt; sw </tspan><tspan x="120.0" fill="#bc8cff">$t9</tspan><tspan x="143.6" fill="#e6edf3">,24($s0)    | sw </tspan><tspan x="277.0" fill="#bc8cff">$t6</tspan><tspan x="300.6" fill="#e6edf3">,24($s0)     </tspan><tspan x="402.6" fill="#bc8cff">t9-&gt;t6 [w3]</tspan></text><text y="620" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">     16 &gt; lw </tspan><tspan x="120.0" fill="#3fb950">$t6</tspan><tspan x="143.6" fill="#e6edf3">,28($s0)    | lw </tspan><tspan x="277.0" fill="#3fb950">$t7</tspan><tspan x="300.6" fill="#e6edf3">,28($s0)     </tspan><tspan x="402.6" fill="#3fb950">t6-&gt;t7 [w4]</tspan></text><text y="639" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">     17 &gt; addu $a0,$s0,</tspan><tspan x="198.5" fill="#3fb950">$t6</tspan><tspan x="222.1" fill="#e6edf3">  | addu $a0,$s0,</tspan><tspan x="355.5" fill="#3fb950">$t7</tspan><tspan x="379.1" fill="#e6edf3">   </tspan><tspan x="402.6" fill="#3fb950">t6-&gt;t7 [w4]</tspan></text><text y="658" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">     18   jal 0 &lt;animApply&gt; | jal 0 &lt;animApply&gt;</tspan></text><text y="677" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">     19   nop               | nop</tspan></text><text y="696" xml:space="preserve"></text><text y="715" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">WEBS (one consistent substitution may explain many sites)</tspan></text><text y="734" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="33.7" fill="#39c5cf">w1  t7-&gt;t8</tspan><tspan x="112.2" fill="#e6edf3">  count=2 rows=12,13</tspan></text><text y="753" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="33.7" fill="#d29922">w2  t8-&gt;t9</tspan><tspan x="112.2" fill="#e6edf3">  count=2 rows=13,14</tspan></text><text y="772" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="33.7" fill="#bc8cff">w3  t9-&gt;t6</tspan><tspan x="112.2" fill="#e6edf3">  count=2 rows=14,15</tspan></text><text y="791" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">  </tspan><tspan x="33.7" fill="#3fb950">w4  t6-&gt;t7</tspan><tspan x="112.2" fill="#e6edf3">  count=2 rows=16,17</tspan></text><text y="810" xml:space="preserve"></text><text y="829" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">next: one upstream event, not 6 sites (temp lane, slot 5, aligned row 12, rotation +1).</tspan></text><text y="848" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">      perturb the PRECEDING block: hoist a call-argument expression into a named local, which reorders value deaths.</tspan></text><text y="867" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">      or materialize a phantom pool get with `(x == C) != 0` inside a real `if`; a bare discarded expression is dropped with no codegen effect.</tspan></text><text y="886" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">      do not fix the divergent sites individually; declaration-order permutation is a dead family here.</tspan></text><text y="905" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">      field guide levers for playbook=temp-fifo-phase:</tspan></text><text y="924" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">        lever 14: hoist a call-argument expression into a named local in the block BEFORE the divergence; that reorders the value deaths</tspan></text><text y="943" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">        lever 15: materialize a phantom pop with `(state == -1) != 0` inside a real `if`; a bare discarded expression is dropped instead</tspan></text><text y="962" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">        lever 16: add a redundant assembler-folded mask (`((s16)fx &amp; 0x3fff) &lt;&lt; 18`) for a genuinely free FIFO rotation</tspan></text><text y="981" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">      read them: decomp-workbench guide temp-fifo-phase</tspan></text><text y="1000" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">      don&#x27;t have an instrumented toolchain? levers 14-16 are pure source and are the first move; the lane rotation above already locates the preceding block to perturb.</tspan></text><text y="1019" xml:space="preserve"><tspan x="18.0" fill="#e6edf3">      have one, and those levers are spent? decomp-workbench trace-fifo TRACE.log replays the pool get/put schedule.</tspan></text></svg>