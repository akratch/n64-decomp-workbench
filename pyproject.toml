[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "n64-decomp-workbench"
version = "0.4.0"
description = "Diagnose late-stage MIPS decompilation mismatches"
readme = "README.md"
requires-python = ">=3.10"
license = "CC0-1.0"
license-files = ["LICENSE.md"]
authors = [{ name = "N64 decompilation contributors" }]
keywords = ["decompilation", "ido", "mips", "n64", "reverse-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Compilers",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.9",
    "build>=1.2",
    "check-wheel-contents>=0.6",
    "codespell>=2.4",
    # Pinned to the current minor series: CI reproducibility, since a newer
    # minor has repeatedly landed new checks/stricter defaults (formatter
    # drift, new mypy errors) that silently break a previously-green build.
    "mypy>=2.3,<2.4",
    "ruff>=0.16,<0.17",
    "twine>=6",
]

[project.scripts]
decomp-workbench = "decomp_workbench.cli:main"

[project.urls]
Repository = "https://github.com/akratch/n64-decomp-workbench"
Issues = "https://github.com/akratch/n64-decomp-workbench/issues"
Documentation = "https://github.com/akratch/n64-decomp-workbench/blob/main/docs/README.md"
Changelog = "https://github.com/akratch/n64-decomp-workbench/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
decomp_workbench = [
    "docs/compiler-laws/*.md",
    "docs/field-guide.md",
    "fingerprints/*.c",
    "patches/*.md",
    "patches/*.patch",
    "py.typed",
    "skills/n64-decomp-campaign/SKILL.md",
    "skills/n64-decomp-campaign/agents/*.yaml",
    "skills/n64-decomp-campaign/references/*.md",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.codespell]
# "tne" is the MIPS trap-if-not-equal mnemonic; "pavin" is the uopt
# partial-availability-in per-block field decoded in the dp64 field notes;
# "statics" is the C term for file-scope static definitions.
ignore-words-list = "disjointness,dout,pavin,tne,nd,statics"
skip = "examples/cv64/scratches/*/context.c,./research-archive"
