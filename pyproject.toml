[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "n64-decomp-workbench"
version = "0.2.0"
description = "MIPS decompilation oracles, campaigns, compiler traces, and pass replay"
readme = "README.md"
requires-python = ">=3.10"
license = "CC0-1.0"
license-files = ["LICENSE.md"]
authors = [{ name = "DKR decompilation contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Compilers",
]

[project.optional-dependencies]
dev = ["ruff>=0.9"]

[project.scripts]
decomp-workbench = "decomp_workbench.cli:main"

[project.urls]
Repository = "https://github.com/akratch/Diddy-Kong-Racing"
Issues = "https://github.com/akratch/Diddy-Kong-Racing/issues"

[tool.setuptools.packages.find]
where = ["src"]
